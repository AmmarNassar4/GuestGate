<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GuestGate — Mobile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --page-bg: #f2f6fb;
      --radius: 1rem;
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, .08);
    }

    body {
      background: linear-gradient(180deg, #f9fbff 0%, var(--page-bg) 100%);
      min-height: 100vh;
    }

    .shell {
      max-width: 860px;
      margin: 0 auto;
    }

    .surface-card,
    .hero {
      border: 0;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      background: rgba(255, 255, 255, .92);
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .hero {
      background: rgba(255, 255, 255, .78);
    }

    .form-control,
    .form-select {
      min-height: 46px;
    }


    .mobile-hint {
      font-size: .82rem;
    }


    .action-bar {
      display: grid;
      grid-template-columns: 1fr;
      gap: .6rem;
      align-items: center;
    }

    #msg {
      min-height: 1.2rem;
      font-weight: 600;
    }

    .readonly {
      background: #f8fafc;
      border-style: dashed;
      opacity: .85;
    }

    @media (min-width: 768px) {
      .action-bar {
        grid-template-columns: auto auto 1fr;
      }
    }
  </style>
</head>
<body class="py-3 py-md-4">
  <main class="container-fluid px-3 px-md-4 shell">
    <section class="hero mb-3">
      <h5 class="mb-1">Welcome</h5>
      <p class="text-muted mb-0">Review and complete your guest details.</p>
    </section>

    <form id="f" class="surface-card" autocomplete="on">
      <div id="fields" class="row g-3"></div>
      <div class="mt-3 action-bar">
        <button id="submitBtn" class="btn btn-primary btn-lg" type="submit">Submit</button>
        <button id="copyBtn" class="btn btn-outline-secondary btn-lg" type="button">Copy data</button>
        <span id="msg" class="ms-md-2 text-primary"></span>
      </div>
    </form>
  </main>

<script src="/lib/guestgate-phone-input.js"></script>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const et = qs.get('et');
  const form = document.getElementById('f');
  const fieldsHost = document.getElementById('fields');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  const copyBtn = document.getElementById('copyBtn');

  if(!et){ setMsg('Invalid link: missing et', 'danger'); form.classList.add('d-none'); return; }

  function setMsg(text, tone){
    msg.textContent = text || '';
    msg.className = 'ms-md-2 ' + (tone === 'danger' ? 'text-danger' : tone === 'success' ? 'text-success' : 'text-primary');
  }

  function colClassFor(field){
    const dt = String(field.dataType || '').toLowerCase();
    if(dt === 'textarea' || dt === 'multiline' || dt === 'notes') return 'col-12';
    return 'col-12 col-md-6';
  }

  function fieldKey(field){ if(!field.__guestGateKey) field.__guestGateKey = field.key || field.name || ('field_' + Math.random().toString(36).slice(2)); return field.__guestGateKey; }
  function fieldLabel(field){ return field.label || fieldKey(field); }
  function isRequired(field){ return !!(field.guest && field.guest.required); }
  function isEditable(field){ return !(field.guest && field.guest.editable === false); }
  function isHidden(field){ return !!(field.guest && field.guest.hide === true); }
  function isPhoneField(field){
    if(window.GuestGatePhone) return window.GuestGatePhone.isPhoneField(field);
    const text = [fieldKey(field), fieldLabel(field), field.dataType || ''].join(' ').toLowerCase();
    return ['phone','tel','mobile'].includes(String(field.dataType || '').toLowerCase()) || ['mobile','phone','tel','جوال','موبايل','هاتف','تليفون','تلفون'].some(k => text.includes(k));
  }

  function cleanOptions(options){
    if(!Array.isArray(options)) return [];
    return options.map(o => {
      if(typeof o === 'string') return { value: o, text: o };
      if(o && typeof o === 'object') {
        const value = o.value ?? o.key ?? o.id ?? o.text ?? '';
        const text = o.label ?? o.text ?? value;
        return { value, text };
      }
      return { value: '', text: '' };
    });
  }

  function buildStandardInput(field){
    const dtype = String(field.dataType || 'Text').toLowerCase();
    let input;
    if(dtype === 'enum'){
      input = document.createElement('select');
      input.className = 'form-select form-select-lg';
      for(const o of cleanOptions(field.options)){
        const opt = document.createElement('option');
        opt.value = o.value ?? '';
        opt.textContent = o.text ?? '';
        input.appendChild(opt);
      }
    } else if(dtype === 'textarea' || dtype === 'multiline' || dtype === 'notes') {
      input = document.createElement('textarea');
      input.className = 'form-control';
      input.rows = 4;
    } else {
      input = document.createElement('input');
      input.className = 'form-control form-control-lg';
      input.type = ({ text:'text', number:'number', date:'date', email:'email', phone:'tel', tel:'tel', mobile:'tel', idnumber:'text' }[dtype]) || 'text';
      if(input.type === 'tel') input.inputMode = 'tel';
      if(input.type === 'email') input.inputMode = 'email';
    }

    if(field.validation){
      if(field.validation.minLength) input.minLength = field.validation.minLength;
      if(field.validation.maxLength) input.maxLength = field.validation.maxLength;
      if(field.validation.regex) input.pattern = field.validation.regex;
    }

    return input;
  }

  function setInputReadonly(input, editable){
    if(editable) return;
    if(input.tagName === 'SELECT') input.disabled = true;
    else input.readOnly = true;
    input.classList.add('readonly');
  }

  function valueForField(key, el){
    if(window.GuestGatePhone && el.dataset.guestgatePhone === '1') return window.GuestGatePhone.getValue(el);
    let v = (el.value ?? '').toString().trim();
    if(el.type === 'date' && v === '') v = null;
    return v;
  }

  function collectData(){
    const data = {};
    form.querySelectorAll('[data-field]').forEach(el => {
      const key = el.dataset.field;
      if(!key) return;
      data[key] = valueForField(key, el);
    });
    return data;
  }

  function renderFields(template, prefill){
    fieldsHost.innerHTML = '';

    const fields = (template.fields || [])
      .filter(f => !isHidden(f))
      .filter(f => !f.scope || f.scope === 'StartForm')
      .sort((a,b) => (a.order || 0) - (b.order || 0));

    if(!fields.length){
      fieldsHost.innerHTML = '<div class="col-12"><div class="alert alert-warning mb-0">No fields available for this form.</div></div>';
      submitBtn.disabled = true;
      return;
    }

    for(const field of fields){
      const key = fieldKey(field);
      const value = (prefill && prefill[key] !== undefined && prefill[key] !== null) ? prefill[key] : (field.defaultValue ?? '');
      const col = document.createElement('div');
      col.className = isPhoneField(field) ? 'col-12 col-sm-6' : colClassFor(field);

      const label = document.createElement('label');
      label.className = 'form-label';
      label.textContent = fieldLabel(field) + (isRequired(field) ? ' *' : '');
      col.appendChild(label);

      if(isPhoneField(field)){
        const phoneInput = window.GuestGatePhone
          ? window.GuestGatePhone.createInput(field, value, {
              key,
              required: isRequired(field),
              readOnly: !isEditable(field),
              className: 'form-control form-control-lg',
              placeholder: field.placeholder || 'Mobile number'
            })
          : buildStandardInput({ ...field, dataType: 'tel' });
        phoneInput.name = key;
        phoneInput.dataset.field = key;
        if(isRequired(field)) phoneInput.required = true;
        setInputReadonly(phoneInput, isEditable(field));
        col.appendChild(phoneInput);
        const hint = document.createElement('div');
        hint.className = 'form-text mobile-hint';
        hint.textContent = 'Select the country and enter the number; it will be saved in international format like +9665xxxxxxx.';
        col.appendChild(hint);
      } else {
        const input = buildStandardInput(field);
        input.name = key;
        input.dataset.field = key;
        if(isRequired(field)) input.required = true;
        setInputReadonly(input, isEditable(field));
        if(value !== undefined && value !== null) input.value = value;
        col.appendChild(input);
      }

      fieldsHost.appendChild(col);
    }
  }

  async function load(){
    try{
      setMsg('Loading...', 'primary');
      const cfgRes = await fetch(`/api/mobile/form-config?et=${encodeURIComponent(et)}`, { cache: 'no-store' });
      if(!cfgRes.ok){ setMsg('Unable to load form configuration.', 'danger'); return; }
      const cfg = await cfgRes.json();
      renderFields(cfg.template || {}, cfg.prefill || {});
      setMsg('', 'primary');
    } catch(e){
      setMsg('Unable to load form configuration.', 'danger');
    }
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(window.GuestGatePhone && !(await window.GuestGatePhone.validateForm(form))){
      setMsg('Please check the mobile number.', 'danger');
      return;
    }
    setMsg('Saving...', 'primary');
    submitBtn.disabled = true;
    const data = collectData();

    try{
      const res = await fetch('/api/mobile/save', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ et, data })
      });

      if(res.ok){ setMsg('Thanks! Your details were saved.', 'success'); setTimeout(()=> window.close(), 1500); }
      else if(res.status === 410){ setMsg('Session expired. Please rescan.', 'danger'); }
      else { let err=''; try{err=(await res.json()).error||'';}catch{} setMsg('Error: '+(err||res.status), 'danger'); }
    } catch {
      setMsg('Network error while saving.', 'danger');
    } finally {
      submitBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(collectData(), null, 2));
      setMsg('Copied', 'success');
      setTimeout(() => setMsg('', 'primary'), 1200);
    } catch {
      setMsg('Copy failed', 'danger');
    }
  });

  load();
})();
</script>
</body>
</html>
